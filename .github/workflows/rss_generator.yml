name: Generate RSS Feed

on:
  push:
    branches:
      - master  # 或你想要的分支
    paths:
      - '.github/workflows/rss_generator.yml'
      - 'rss_generator.py'
      - 'config.yaml'
      - 'bilibili_rss.py'
  schedule:
    - cron: '0 0 * * *'  # 每天运行一次
  workflow_dispatch:  # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'  # 或其他你需要的版本

    - name: Install dependencies
      run: |
        sudo apt-get install -y chromium-browser
        pip install -r requirements.txt  # 确保requirements.txt包含selenium和其他依赖

    - name: Run RSS generator
      env:
        DISPLAY: ':99'  # 设置无头浏览器显示
      run: |
        Xvfb :99 -ac &
        python rss_generator.py  # 运行你的Python脚本
        
    - name: Run Bilibili RSS generator
      continue-on-error: true
      env:
        BILI_SESSDATA: ${{ secrets.BILI_SESSDATA }}
        BILI_JCT: ${{ secrets.BILI_JCT }}
        BILI_BUVID3: ${{ secrets.BILI_BUVID3 }}
      run: |
        python bilibili_rss.py 
        
    - name: Download Microsoft Research Feed
      run: |
        curl -o rss/MicrosoftResearch.xml https://www.microsoft.com/en-us/research/feed/
    
    - name: Install html2rss
      run: |
        sudo apt-get update
        sudo apt-get install -y ruby-full
        sudo gem install html2rss
        

    - name: Generate RSS from URL list
      run: |
        mkdir -p rss
        while IFS= read -r url || [ -n "$url" ]; do
          [ -z "$url" ] && continue
          [[ "$url" =~ ^# ]] && continue

          slug=$(echo "$url" | sed -E 's#https?://##; s#[/?=&]#_#g; s#[^A-Za-z0-9._-]#_#g' | cut -c1-80)
          output="rss/auto_${slug}.xml"

          echo "Generating RSS for: $url"
          if html2rss scrape "$url" > "$output"; then
            echo "Generated: $output"
          else
            echo "Failed: $url"
            rm -f "$output"
          fi
        done < auto_sites.txt
    
    - name: Commit and push changes
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # 使用GITHUB_TOKEN
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add rss/*
        git commit -m "Update RSS feeds"
        git push origin master
